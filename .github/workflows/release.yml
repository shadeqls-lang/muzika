# push a tag like v0.2.1 -> github builds muzika.exe on windows and publishes a release.
# every installed muzika finds that release and updates itself.
# write what changed in notes.md before releasing: muzika shows it after the update.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: stamp version from the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d') { $tag = "v" + (Get-Content version.txt -Raw).Trim() }
          $ver = $tag.TrimStart('v')
          (Get-Content src/Program.cs -Raw) -replace 'public const string Version = "[^"]*";', "public const string Version = `"$ver`";" | Set-Content src/Program.cs -NoNewline
          Set-Content version.txt $ver
          "VER=$ver" | Out-File $env:GITHUB_ENV -Append
          "TAG=$tag" | Out-File $env:GITHUB_ENV -Append

      - name: build
        shell: cmd
        env:
          CI: "1"
        run: build.bat

      - name: check the exe
        shell: pwsh
        run: |
          if (-not (Test-Path muzika.exe)) { throw "muzika.exe was not built" }
          Get-Item muzika.exe | Select-Object Name, Length

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: muzika ${{ env.TAG }}
          prerelease: false   # the in-app updater only sees normal releases
          body_path: notes.md   # shown inside muzika as "what's new"
          files: muzika.exe
